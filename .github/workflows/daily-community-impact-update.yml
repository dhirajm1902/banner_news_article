name: Daily Community Impact Update

on:
  schedule:
    - cron: '30 22 * * *'  # 4:00 AM IST daily (staggered from other daily scrapers)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install patchright beautifulsoup4 pandas requests \
            "supabase>=2.0.0,<3.0.0" \
            "langchain-groq>=0.1.0,<0.4.0" "langchain-core>=0.2.0,<0.4.0"

      - name: Install Patchright browser
        run: patchright install --with-deps chromium

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Community Impact scraper
        # communityimpact.com has a Cloudflare "Just a moment..." bot-check —
        # same as the Costco scraper in company_website_comingsoon.py — so it
        # needs a real (non-headless) browser window; xvfb-run gives it one.
        run: xvfb-run -a python community_impact_scraper.py

      - name: Run Community Impact extractor (Groq AI)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "${GROQ_API_KEY}" ]; then
            echo "GROQ_API_KEY secret not configured — skipping AI extraction step"
            exit 0
          fi
          python community_impact_auto_extract.py

      - name: Sync master file to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync_to_supabase.py

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add community_impact_latest.json || true
          git add community_impact_extraction_latest.json || true
          git add data/community_impact/ || true
          git add master_file/ || true
          git diff --staged --quiet || git commit -m "Auto-update: Daily Community Impact fetch $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin main && break
            echo "Push attempt $i failed, retrying in 15s..."
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
